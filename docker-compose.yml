services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: revivex
      POSTGRES_USER: revivex
      POSTGRES_PASSWORD: revivex
    ports: ["5432:5432"]
    volumes: ["revivex_pg:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      REVIVEX_MODE: ${REVIVEX_MODE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/revivex
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: revivex
      DB_PASSWORD: revivex
      DDL_AUTO: update
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CALLBACK_URL: ${RAZORPAY_CALLBACK_URL:-http://localhost:5173/payment-result}
      LLM_ENABLED: ${LLM_ENABLED:-false}
    ports: ["8080:8080"]
    depends_on: [postgres]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  revivex_pg:
