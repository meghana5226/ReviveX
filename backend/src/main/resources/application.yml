server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: revivex
  datasource:
    url: ${DB_URL:jdbc:h2:mem:revivex;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
revivex:
  mode: ${REVIVEX_MODE:demo}
  razorpay:
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    callback-url: ${RAZORPAY_CALLBACK_URL:http://localhost:5173/payment-result}
  llm:
    enabled: ${LLM_ENABLED:false}
